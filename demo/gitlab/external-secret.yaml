apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-webhooks
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    # Use an existing ESO store with access to the signing token.
    name: gitlab-webhooks
  target:
    name: gitlab-webhooks
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Also usable through KafkaGrpcGateway's secretRef.
        signing-token: "{{ .signing_token }}"
      templateFrom:
        - target: Data
          configMap:
            name: gitlab-webhooks-template
            items:
              - key: webhooks.toml
                templateAs: Values
  data:
    - secretKey: signing_token
      remoteRef:
        # The provider value must be the complete whsec_... token, as text.
        key: gitlab-webhook-signing-token
        decodingStrategy: None
