[workspace]
resolver = "2"
members = ["crates/*"]
# tools/mutants pins cargo-mutants from its own lockfile so the sweep tool is
# versioned independently of what the crates under test depend on. It is not a
# member: cargo refuses a manifest that sits under a workspace root without
# belonging to it.
exclude = ["tools/mutants"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
authors = ["The Krabka Authors"]
rust-version = "1.99.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Intentional while the public API is still pre-1.0; re-evaluate once the
# API surfaces stabilise.
clone_on_copy = "warn"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.dev]
# Split debug info into a separate file (reduces linker work)
split-debuginfo = "packed"

[workspace.dependencies]
anyhow = "1"
apache-avro = "0.22"
arc-swap = "1"
arrow = { version = "59", default-features = false, features = ["ipc"] }
assert2 = "0.4"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
connectrpc-axum = "0.2"
connectrpc-axum-build = "0.2"
dashmap = "6"
datafusion = "55.1"
derive_more = { version = "2", features = ["display", "from", "into", "deref", "as_ref", "constructor", "from_str", "add", "add_assign", "mul", "sum"] }
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
hmac = "0.13"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
jsonpath-rust = "1.0"
jsonschema = { version = "0.58", default-features = false }
mutants = "0.0.4"
pbjson = "0.9"
prometheus-client = "0.25"
prost = "0.14"
prost-build = "0.14"
prost-reflect = "0.16"
protoc-bin-vendored = "3.2"
protox = "0.9"
protox-parse = "0.9"
refined_type = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
temp-env = "0.3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", default-features = false }
toml = "1.1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# Sibling repositories. Declared against crates.io here and in the member
# manifests; the patch table below is the single place a revision is bumped.
krabka-authz = "0.7.0"
krabka-broker = "0.7.0"
krabka-client-admin = "0.5.0"
krabka-client-consumer = "0.5.0"
krabka-client-core = "0.5.0"
krabka-client-producer = "0.5.0"
krabka-client-streams = "0.4.1"
krabka-ids = "0.5.0"
krabka-metadata = { git = "https://github.com/krabka-io/krabka-protocol", rev = "b9d97dc878d3fad8889f15eeeb1bbb2fc1b57dd8" }
krabka-protocol = "0.5.0"
krabka-security = "0.5.0"
krabka-telemetry = "0.7.0"
krabka-units = "0.5.0"

# Every crate each sibling publishes is listed, not only the ones this repo
# names directly: cargo ignores a dependency's own patch table, so a crate
# reached transitively would otherwise come from the registry while its git
# twin is also in the graph.
#
# Cargo warns that the entries this repo does not currently reach are unused.
# That is expected and the entries stay. None of these crates is on crates.io
# today, so a missing patch fails loudly rather than resolving to a registry
# copy -- but the moment one is published, a gap here becomes a silent
# substitution instead, which is the failure this table exists to prevent.
[patch.crates-io]
# Keep the RPC error small for async handlers under Rust 1.99.
connectrpc-axum = { git = "https://github.com/krabka-io/connectrpc-axum", rev = "f554042b0af04be40d07ecee9cb2623dd6d56542" }
connectrpc-axum-core = { git = "https://github.com/krabka-io/connectrpc-axum", rev = "f554042b0af04be40d07ecee9cb2623dd6d56542" }
connectrpc-axum-build = { git = "https://github.com/krabka-io/connectrpc-axum", rev = "f554042b0af04be40d07ecee9cb2623dd6d56542" }
krabka-compression = { git = "https://github.com/krabka-io/krabka-protocol", rev = "b9d97dc878d3fad8889f15eeeb1bbb2fc1b57dd8" }
krabka-hlc = { git = "https://github.com/krabka-io/krabka-protocol", rev = "b9d97dc878d3fad8889f15eeeb1bbb2fc1b57dd8" }
krabka-ids = { git = "https://github.com/krabka-io/krabka-protocol", rev = "b9d97dc878d3fad8889f15eeeb1bbb2fc1b57dd8" }
krabka-kafka-tap = { git = "https://github.com/krabka-io/krabka-protocol", rev = "b9d97dc878d3fad8889f15eeeb1bbb2fc1b57dd8" }
krabka-metadata = { git = "https://github.com/krabka-io/krabka-protocol", rev = "b9d97dc878d3fad8889f15eeeb1bbb2fc1b57dd8" }
krabka-protocol = { git = "https://github.com/krabka-io/krabka-protocol", rev = "b9d97dc878d3fad8889f15eeeb1bbb2fc1b57dd8" }
krabka-security = { git = "https://github.com/krabka-io/krabka-protocol", rev = "b9d97dc878d3fad8889f15eeeb1bbb2fc1b57dd8" }
krabka-trace-context = { git = "https://github.com/krabka-io/krabka-protocol", rev = "b9d97dc878d3fad8889f15eeeb1bbb2fc1b57dd8" }
krabka-units = { git = "https://github.com/krabka-io/krabka-protocol", rev = "b9d97dc878d3fad8889f15eeeb1bbb2fc1b57dd8" }
krabka-voters = { git = "https://github.com/krabka-io/krabka-protocol", rev = "b9d97dc878d3fad8889f15eeeb1bbb2fc1b57dd8" }
krabka-client-admin = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "69686cdd9bf40d8d637425dc4510ce94b7006e85" }
krabka-client-consumer = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "69686cdd9bf40d8d637425dc4510ce94b7006e85" }
krabka-client-coordination = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "69686cdd9bf40d8d637425dc4510ce94b7006e85" }
krabka-client-core = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "69686cdd9bf40d8d637425dc4510ce94b7006e85" }
krabka-client-producer = { git = "https://github.com/krabka-io/krabka-client-rs", rev = "69686cdd9bf40d8d637425dc4510ce94b7006e85" }
krabka-audit = { git = "https://github.com/krabka-io/krabka-broker", rev = "b0f53a262767ea252db54bce3bab905160ec69b3" }
krabka-authz = { git = "https://github.com/krabka-io/krabka-broker", rev = "b0f53a262767ea252db54bce3bab905160ec69b3" }
krabka-broker = { git = "https://github.com/krabka-io/krabka-broker", rev = "b0f53a262767ea252db54bce3bab905160ec69b3" }
krabka-format = { git = "https://github.com/krabka-io/krabka-broker", rev = "b0f53a262767ea252db54bce3bab905160ec69b3" }
krabka-kraft-core = { git = "https://github.com/krabka-io/krabka-broker", rev = "b0f53a262767ea252db54bce3bab905160ec69b3" }
krabka-log = { git = "https://github.com/krabka-io/krabka-broker", rev = "b0f53a262767ea252db54bce3bab905160ec69b3" }
krabka-logfmt = { git = "https://github.com/krabka-io/krabka-broker", rev = "b0f53a262767ea252db54bce3bab905160ec69b3" }
krabka-object-store = { git = "https://github.com/krabka-io/krabka-broker", rev = "b0f53a262767ea252db54bce3bab905160ec69b3" }
