krabka-telemetry = { git = "https://github.com/krabka-io/krabka-broker", rev = "b0f53a262767ea252db54bce3bab905160ec69b3" }
krabka-throttle = { git = "https://github.com/krabka-io/krabka-broker", rev = "b0f53a262767ea252db54bce3bab905160ec69b3" }
krabka-verified = { git = "https://github.com/krabka-io/krabka-broker", rev = "b0f53a262767ea252db54bce3bab905160ec69b3" }
