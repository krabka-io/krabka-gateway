name: sdk-java

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-java:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk-java
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
      - name: Generate SDK stubs
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.54.0 generate
          git diff --exit-code -- buf.gen.yaml sdks/java/gen
      - name: Build and test the Java SDK
        working-directory: sdks/java
        run: ./gradlew build test installDist
      - name: Run Java SDK conformance
        run: cargo run -p krabka-sdk-conformance --bin conformance -- --adapter sdks/java/build/install/krabka-sdk-java/bin/krabka-sdk-java --vectors crates/sdk-conformance/vectors/v1
      - name: Run live-compatible Java SDK conformance
        run: cargo run -p krabka-sdk-conformance --bin conformance -- --adapter sdks/java/build/install/krabka-sdk-java/bin/krabka-sdk-java --vectors crates/sdk-conformance/vectors/v1 --live-substrate --live-compatible-only
