name: ci

# The Rust half of this repository: the gateway, the Rust application SDK and
# the conformance runner. Bazel builds and tests it, as in the sibling
# repositories. The four other SDKs have a workflow each, because each needs a
# toolchain that this workflow does not install.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, 05:00 UTC: the mutation sweep.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The Aspect CLI uploads test logs and BEP through the Actions artifact API.
  # GitHub gives the OIDC token for that API only to jobs that hold this
  # permission. Without it, the CLI skips the uploads and says so on every job.
  id-token: write

# Cancel superseded PR runs. Let pushes to main run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Build, test, lint and format. The Aspect CLI narrows each step to the
  # targets that the change touched. `bazel build //...` and
  # `bazel test //...` do the same work without the CLI.
  ci:
    name: build · test · lint · format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Change detection needs the merge base, not only the tip.
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # `--severity` defaults to `auto`. The CLI resolves that to `fail` on CI
      # and to `info` elsewhere, so this step gates here and only reports
      # locally.
      - name: format
        run: aspect format
      # `aspect lint` reads the `rules_lint_machine` output group. The clippy
      # aspect from aspect_rules_lint_rust writes it (see
      # //tools/lint/linters.bzl). `bazel test //...` gates on the same aspect
      # through the `*_clippy` targets.
      - name: lint
        run: aspect lint --aspect=//tools/lint:linters.bzl%clippy
      - name: build
        run: aspect build //...
      - name: test
        run: aspect test //...

  # LCOV over the first-party crates. A separate job, because instrumented
  # binaries are a different build and would only evict the `ci` job's cache.
  coverage:
    name: coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-coverage
          repository-cache: true
      - run: bazel coverage //crates/...
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: bazel-out/_coverage/_coverage_report.dat
          disable_search: true
          fail_ci_if_error: false

  # rustdoc for every crate, kept as an artifact. The `ci` job builds these
  # too, but `aspect build` builds only the crates that a change touched.
  docs:
    name: docgen
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-docs
          repository-cache: true
      - run: bazel build $(bazel query 'kind("rust_doc rule", //crates/...)')
      - uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: bazel-bin/crates/**/*.rustdoc
          if-no-files-found: error

  # Build the gateway image and run it in a container. The `ci` job runs
  # //packaging:image_binaries_test, which checks the layer without a daemon.
  # This job loads the image into the runner's Docker daemon and starts the
  # gateway under the glibc and the loader of the apko base.
  image:
    name: image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-image
          repository-cache: true
      - name: build and run the image
        run: bazel test -c opt --config=docker //packaging:image_docker_test

  # Push the gateway image to ghcr.io, tagged with the commit SHA. A `v*` tag
  # later promotes this image by digest. See release.yml. The digest goes into
  # an artifact, so the release promotes the image that this run tested and
  # does not rebuild it.
  delivery:
    name: delivery
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ci, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/krabka-io/krabka-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-image
          repository-cache: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: test the delivery image
        run: bazel test -c opt --config=docker //packaging:image_docker_test
      - name: push
        run: bazel run -c opt //packaging:push -- --tag "${GITHUB_SHA}"
      - name: record the delivery image digest
        run: |
          set -euo pipefail
          bazel build -c opt //packaging:image_manifest_blob
          manifest="$(bazel cquery -c opt //packaging:image_manifest_blob --output=files)"
          expected="sha256:$(sha256sum "${manifest}" | cut -d ' ' -f 1)"
          actual="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" |
            awk '$1 == "Digest:" { print $2; exit }')"
          if [ "${actual}" != "${expected}" ]; then
            echo "${IMAGE}:${GITHUB_SHA} is ${actual}, but the build produced ${expected}." >&2
            exit 1
          fi
          echo "${expected}" >delivery-image.digest
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-image
          path: delivery-image.digest
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  # `jvm_differential` starts a cp-kafka container and drives the JVM console
  # consumer against the gateway. It is `manual` in //crates/gateway, so
  # `bazel test //...` does not run it. This job names it.
  jvm-differential:
    name: gateway JVM differential
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-jvm
          repository-cache: true
      # Pull the image first, so that a registry problem fails this one step
      # with Docker's own message. Without the pull, the first `docker run` in
      # the test pays for it, and a stalled pull waits inside the test until
      # the job times out. The tag is `IMAGE` in
      # crates/gateway/tests/jvm_differential.rs. Change both together.
      - name: Preload Docker images
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 180 docker pull mirror.gcr.io/confluentinc/cp-kafka:7.5.0 || {
            echo "::error::docker pull mirror.gcr.io/confluentinc/cp-kafka:7.5.0 failed or stalled past 180s"
            exit 1
          }
      - name: JVM differential
        run: |
          bazel test //crates/gateway:jvm_differential_test \
            --test_arg=--ignored \
            --test_output=streamed

  # The Rust application SDK against the vectors that every other SDK runs,
  # first offline and then against a live in-process gateway.
  sdk-rust:
    name: sdk-rust conformance
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-sdk-rust
          repository-cache: true
      - name: Build the runner and the Rust adapter
        run: bazel build //crates/sdk-conformance:conformance //crates/app-sdk:conformance_adapter
      - name: Run SDK conformance
        run: |
          set -euo pipefail
          runner="$(bazel cquery --output=files //crates/sdk-conformance:conformance)"
          adapter="$(bazel cquery --output=files //crates/app-sdk:conformance_adapter)"
          "${runner}" --adapter "${adapter}" --vectors crates/sdk-conformance/vectors/v1
          "${runner}" --adapter "${adapter}" --vectors crates/sdk-conformance/vectors/v1 \
            --live-substrate --live-compatible-only

  # A mutation sweep rebuilds and reruns a crate's tests once per mutant, so it
  # is far too slow to gate a pull request. One job per crate, so each one has
  # its own bound and reports its own result.
  #
  # `continue-on-error`: survivors are the expected state. The job produces a
  # list to read. Make it blocking when the score is worth defending.
  mutants-select:
    name: select mutants targets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      crates: ${{ steps.select.outputs.crates }}
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-mutants
          repository-cache: true
      - id: select
        run: |
          set -euo pipefail
          crates="$(
            bazel query 'kind("cargo_mutants_test rule", //crates/...)' |
              jq -R -s -c 'split("\n") | map(select(length > 0)) |
                map({target: ., name: (. | split("/")[3] | split(":")[0])})'
          )"
          echo "crates=${crates}" >>"${GITHUB_OUTPUT}"
          echo "Selected: ${crates}"
  mutants:
    name: mutants · ${{ matrix.crate.name }}
    needs: mutants-select
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.mutants-select.outputs.crates) }}
    steps:
      - uses: actions/checkout@v7
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-mutants
          repository-cache: true
      - run: bazel test ${{ matrix.crate.target }}
