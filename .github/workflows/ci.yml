name: ci

# The Rust half of this repository: the gateway, the Rust application SDK and
# the conformance runner. The four other SDKs have a workflow each, because
# each needs a toolchain this job does not install.
#
# Cargo is the gate here. The Bazel targets under //crates are checked in and
# describe the same build, but they are not yet gated: they were written
# without a Bazel run to check them against. Make `bazel test //...` the gate
# once one run has proved it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUST_TOOLCHAIN: "1.97.1"
  NEXTEST_VERSION: "cargo-nextest@0.9.143"
  LLVM_COV_VERSION: "cargo-llvm-cov@0.8.7"

jobs:
  # Format, lint and the unit tests, on the platforms the gateway is built for.
  rust:
    name: rust · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-rust
      - uses: taiki-e/install-action@v2
        with:
          # Pinned, not `@latest`. A moving test runner is a silent change to
          # how the suite is selected and retried.
          tool: ${{ env.NEXTEST_VERSION }}
      # rustfmt runs on nightly so `format_code_in_doc_comments` and
      # `imports_granularity` (both unstable, both set in rustfmt.toml) apply.
      # Stable rustfmt skips them without failing, which is worse than not
      # running it. Once, on Linux.
      - name: Install nightly rustfmt
        if: matrix.os == 'ubuntu-latest'
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo +nightly fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Unit tests only. The `tests/*.rs` suites boot an in-process broker and
      # bind listeners; they run in the `integration` job below, on Linux.
      - name: Unit tests
        run: cargo nextest run --workspace --profile ci --lib --bins
      - name: Doctests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --doc

  # The gateway's own logic lives in `src/` but is driven almost entirely from
  # the `tests/` binaries: unary Send, group consume and commit, single-owner
  # dedup, webhook forwarding and the schema codecs, all against an in-process
  # Rust broker. A `--lib --bins` walk never reaches them.
  integration:
    name: gateway integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: gateway-integration
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.LLVM_COV_VERSION }},${{ env.NEXTEST_VERSION }}
      - name: Integration coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov nextest -p krabka-gateway -p krabka-sdk-conformance \
            --profile ci --tests \
            --lcov --output-path coverage/integration.lcov
      # Pull the image up front so a registry problem fails this one step with
      # Docker's own message. Without the preload the first `docker run` in the
      # differential test pays the pull, and a stalled pull sits inside the test
      # until the job timeout. The tag mirrors `IMAGE` in
      # crates/gateway/tests/jvm_differential.rs. Keep them in lockstep.
      - name: Preload Docker images
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 180 docker pull mirror.gcr.io/confluentinc/cp-kafka:7.5.0 || {
            echo "::error::docker pull mirror.gcr.io/confluentinc/cp-kafka:7.5.0 failed or stalled past 180s"
            exit 1
          }
      - name: JVM differential
        run: cargo nextest run --locked -p krabka-gateway --profile ci --test jvm_differential --run-ignored only
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/integration.lcov
          disable_search: true
          flags: gateway-integration
          fail_ci_if_error: false

  # The Rust application SDK against the same vectors every other SDK is
  # replayed against, first offline and then against a live in-process gateway.
  sdk-rust:
    name: sdk-rust conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.NEXTEST_VERSION }}
      - name: Verify the Rust SDK crates
        run: |
          cargo clippy -p krabka-sdk-conformance -p krabka-app-sdk --all-targets --features krabka-app-sdk/conformance-adapter -- -D warnings
          cargo nextest run -p krabka-sdk-conformance -p krabka-app-sdk --profile ci --features krabka-app-sdk/conformance-adapter
      - name: Build the Rust conformance adapter
        run: cargo build -p krabka-app-sdk --bin conformance_adapter --features conformance-adapter
      - name: Run SDK conformance
        run: cargo run -p krabka-sdk-conformance --bin conformance -- --adapter target/debug/conformance_adapter --vectors crates/sdk-conformance/vectors/v1
      - name: Run live-compatible SDK conformance
        run: cargo run -p krabka-sdk-conformance --bin conformance -- --adapter target/debug/conformance_adapter --vectors crates/sdk-conformance/vectors/v1 --live-substrate --live-compatible-only
